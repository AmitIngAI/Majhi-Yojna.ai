<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- ══════════ FAVICON (Government Building Logo) ══════════ -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/logo.svg" />
    <link rel="icon" type="image/png" href="%PUBLIC_URL%/logo.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />

    <!-- ══════════ THEME COLOR (Browser Address Bar) ══════════ -->
    <meta name="theme-color" content="#4F46E5" />
    <meta name="msapplication-TileColor" content="#4F46E5" />

    <!-- ══════════ PRIMARY META TAGS ══════════ -->
    <title>माझी - योजना | Government of Maharashtra Benefits</title>
    <meta name="title" content="MahaBenefit.AI — Government of Maharashtra Benefits" />
    <meta
      name="description"
      content="AI-powered platform helping Maharashtra citizens discover government schemes, welfare benefits, and financial assistance. महाराष्ट्र शासनाच्या योजना, अनुदान आणि लाभ शोधण्यासाठी AI-आधारित मंच. Free, fast, personalized recommendations."
    />
    <meta
      name="keywords"
      content="Maharashtra government schemes, MahaDBT, welfare benefits, government yojana, महाराष्ट्र योजना, AI benefits advisor, PM Kisan, scholarship schemes, farmer schemes, student schemes, pensioner schemes, divyang schemes, social justice schemes"
    />
    <meta name="author" content="MahaBenefit.AI Team" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English, Marathi, Hindi" />
    <meta name="geo.region" content="IN-MH" />
    <meta name="geo.placename" content="Maharashtra, India" />

    
    <!-- ══════════ MANIFEST ══════════ -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- ══════════ GOOGLE FONTS (Plus Jakarta Sans + Noto Sans Devanagari for Marathi) ══════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    
     <!-- Google Translate Widget -->
   <script type="text/javascript">
      function googleTranslateElementInit() {
          new google.translate.TranslateElement(
              {
                  pageLanguage: 'en',
                  includedLanguages: 'en,mr',
                  layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
                  autoDisplay: false
              },
              'google_translate_element'
          );
      }
    </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

  <!-- Hide default Google Translate UI -->
 <style>
    #google_translate_element {
        display: none !important;
    }
    .goog-te-banner-frame {
        display: none !important;
        visibility: hidden !important;
    }
    .goog-te-gadget-icon {
        display: none !important;
    }
    body {
        top: 0 !important;
    }
    .goog-tooltip, .goog-tooltip:hover {
        display: none !important;
    }
    .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
    }
    .skiptranslate iframe {
        display: none !important;
    }
 </style>
  
  </head>

  <body>
    <!-- ══════════ ROOT DIV (React app mounts here) ══════════ -->
    <div id="root"></div>

    <!-- ══════════ HIDE LOADER WHEN APP READY ══════════ -->
    <script>
      window.addEventListener('load', function () {
        setTimeout(function () {
          var loader = document.getElementById('initial-loader');
          if (loader) {
            loader.classList.add('hidden');
            setTimeout(function () {
              loader.remove();
            }, 500);
          }
        }, 800);
      });
    </script>
  </body>
  <div id="google_translate_element"></div>
</html>
